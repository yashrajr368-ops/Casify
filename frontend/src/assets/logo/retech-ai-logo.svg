<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="rtLogoGrad" x1="16" y1="14" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6"/>
      <stop offset="100%" stopColor="#06B6D4"/>
    </linearGradient>
    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stopColor="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Optional Background (Deep Navy) -->
  <rect width="320" height="80" rx="16" fill="#0B1020"/>

  <!-- ICON (60x60 container centered vertically at y=10) -->
  <g transform="translate(14, 10)">
    <!-- Squircle Frame -->
    <rect width="60" height="60" rx="16" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1.2"/>
    
    <!-- Sub-Trace -->
    <path d="M 33 30 L 39 36 H 45" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
    <circle cx="45" cy="36" r="2" fill="#06B6D4"/>

    <!-- Spine -->
    <rect x="13" y="11" width="6.5" height="38" rx="3.25" fill="url(#rtLogoGrad)"/>

    <!-- Neural Bus -->
    <line x1="19.5" y1="22" x2="27" y2="22" stroke="#06B6D4" stroke-width="1.6" stroke-dasharray="2 1.5" stroke-linecap="round"/>
    <circle cx="28" cy="22" r="2.5" fill="#06B6D4"/>

    <!-- Loop -->
    <path d="M 16 14 H 32 C 38 14 43 17.5 43 22.5 C 43 27.5 38 31 32 31 H 16" 
          stroke="url(#rtLogoGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Apex Node -->
    <circle cx="43" cy="22.5" r="3.75" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="43" cy="22.5" r="1.75" fill="#3B82F6"/>

    <!-- Leg -->
    <line x1="26" y1="31" x2="44" y2="49" 
          stroke="url(#rtLogoGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round"/>

    <!-- Terminal Pad -->
    <circle cx="44" cy="49" r="3.75" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="44" cy="49" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- WORDMARK TYPOGRAPHY -->
  <g transform="translate(90, 0)">
    <!-- ReTech in bold pure white -->
    <text x="0" y="50" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="32" 
          letter-spacing="-0.03em" 
          fill="#FFFFFF">ReTech</text>

    <!-- AI Accent Badge / Wordmark -->
    <g transform="translate(132, 26)">
      <rect x="0" y="0" width="44" height="26" rx="6" fill="url(#aiBadgeGrad)" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
      <text x="22" y="18" 
            font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
            font-weight="800" 
            font-size="14" 
            letter-spacing="0.05em" 
            fill="#06B6D4" 
            text-anchor="middle">AI</text>
    </g>
  </g>
</svg>
