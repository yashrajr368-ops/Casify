<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rtSymbolGrad" x1="20" y1="18" x2="80" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6"/>
      <stop offset="100%" stopColor="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- AI Circuit Sub-Trace -->
  <path d="M 53 50 L 63 60 H 73" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  <circle cx="73" cy="60" r="3" fill="#06B6D4"/>

  <!-- Left Main Backbone Spine -->
  <rect x="21" y="18" width="10" height="64" rx="5" fill="url(#rtSymbolGrad)"/>

  <!-- Internal Neural Connection Bus -->
  <line x1="31" y1="36" x2="43" y2="36" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="3 2" stroke-linecap="round"/>
  <circle cx="45" cy="36" r="4" fill="#06B6D4"/>
  <circle cx="45" cy="36" r="1.75" fill="#FFFFFF"/>

  <!-- Upper Neural Loop -->
  <path d="M 26 23 H 51 C 61 23 69 29 69 37 C 69 45 61 51 51 51 H 26" 
        stroke="url(#rtSymbolGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Apex Neural Junction -->
  <circle cx="69" cy="37" r="5.5" fill="#0B1020" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="69" cy="37" r="2.75" fill="#3B82F6"/>

  <!-- Dynamic Forward Circuit Leg -->
  <line x1="42" y1="51" x2="70" y2="79" 
        stroke="url(#rtSymbolGrad)" 
        stroke-width="10" 
        stroke-linecap="round"/>

  <!-- Terminal Circuit Pad -->
  <circle cx="70" cy="79" r="5.5" fill="#0B1020" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="70" cy="79" r="2.25" fill="#FFFFFF"/>
</svg>
