<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReTech AI — Modern AI Smart Device Resale, Exchange & Repair</title>
    <meta name="description" content="ReTech AI: Intelligent AI-Powered Smart Device Resale, Exchange & Repair Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0B1020; color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <div style="width: 64px; height: 64px; border-radius: 18px; background: #0F172A; display: flex; align-items: center; justify-content: center; border: 1.5px solid rgba(59, 130, 246, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px;">
          <svg viewBox="0 0 100 100" style="width: 75%; height: 75%;" fill="none">
            <rect x="21" y="18" width="10" height="64" rx="5" fill="#3B82F6"/>
            <path d="M 26 23 H 51 C 61 23 69 29 69 37 C 69 45 61 51 51 51 H 26" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="42" y1="51" x2="70" y2="79" stroke="#06B6D4" stroke-width="10" stroke-linecap="round"/>
            <circle cx="69" cy="37" r="5" fill="#0B1020" stroke="#06B6D4" stroke-width="2"/>
            <circle cx="70" cy="79" r="5" fill="#0B1020" stroke="#06B6D4" stroke-width="2"/>
          </svg>
        </div>
        <div style="font-weight: 800; font-size: 24px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px;">
          ReTech <span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: rgba(6,182,212,0.15); color: #06B6D4; border: 1px solid rgba(6,182,212,0.3);">AI</span>
        </div>
        <div style="font-size: 12px; color: #64748B; margin-top: 8px;">Loading Smart Platform...</div>
      </div>
    </div>

    <!-- Protocol guard: Alert if opened via file:// instead of http:// -->
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML = `
          <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0B1020; color: #FFFFFF; font-family: sans-serif; padding: 20px; text-align: center;">
            <div style="max-width: 500px; background: #0F172A; border: 1px solid rgba(59,130,246,0.3); border-radius: 20px; padding: 32px;">
              <h2 style="font-size: 20px; color: #38BDF8; margin-bottom: 12px;">⚠️ Server Required</h2>
              <p style="font-size: 14px; color: #94A3B8; line-height: 1.6; margin-bottom: 20px;">
                React applications require a local development server to run and cannot be opened directly from a folder (file://).
              </p>
              <a href="http://localhost:5173" style="display: inline-block; padding: 12px 24px; background: #3B82F6; color: white; text-decoration: none; font-weight: bold; border-radius: 10px; font-size: 14px;">
                Open http://localhost:5173
              </a>
              <p style="font-size: 12px; color: #64748B; margin-top: 16px;">
                Or double-click <strong>RUN_RETECH.bat</strong> on your Desktop.
              </p>
            </div>
          </div>
        `;
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
